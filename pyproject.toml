[project]
name = "bannaha"
version = "0.3.1"
description = "A terminal sandbox for comparing multi-agent coordination strategies across agent harnesses and model backends."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Siavash Monfared", email = "monfared@alum.mit.edu" }]
keywords = ["multi-agent", "llm", "coordination", "agents", "consensus", "blackboard", "anthropic", "openai", "gemini"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "rich>=13.7",
    "textual>=1.0",
    "typer>=0.12",
    "httpx>=0.27",
    "google-genai>=1.0",
    "tomli-w>=1.0",
    # Every harness ships with bannaha, so `uvx bannaha` / `uv tool install bannaha` can run any fleet.
    "anthropic[bedrock]>=0.40",
    "openai-agents>=0.2",
    "google-adk>=1.0",
    "hermes-agent>=0.19",
    "mcp>=1.0",
    "banna>=0.6.1",
    "litellm>=1.50",
    "boto3>=1.34",
]

[project.urls]
Homepage = "https://github.com/siavashmonfared/bannaha"
Repository = "https://github.com/siavashmonfared/bannaha"
Issues = "https://github.com/siavashmonfared/bannaha/issues"

[project.optional-dependencies]
# Kept so older install commands (`bannaha[banna]`, `bannaha[all]`, ...) still work; everything they
# used to add is now a core dependency.
anthropic = []
openai = []
adk = []
google = []
hermes = []
banna = []
litellm = []
bedrock = []
all = []

[project.scripts]
bannaha = "bannaha.cli.app:run_cli"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bannaha"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]  # typer declares CLI options as argument defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
